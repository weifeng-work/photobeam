name: PII Guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan added lines for PII
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          raw = os.environ.get("PII_PATTERNS", "").strip()
          if not raw:
              # [Stage 17 · 修复] 原实现这里 `sys.exit(0)` —— secret 没配就**静默放行**，
              # 等于守门人不存在（公开仓库已两次把真实标识推上去过）。
              # 现在 fail-closed：宁可红一次，也不要在没有规则的情况下冒充"已检查"。
              print("::error::PII_PATTERNS secret is not configured —— PII guard 无法工作（fail-closed）")
              sys.exit(1)

          patterns = [(p["name"], re.compile(p["regex"], re.I)) for p in json.loads(raw)]

          SKIP_EXT = {
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".pdf", ".zip",
              ".gz", ".7z", ".mp4", ".woff", ".woff2", ".ttf", ".jar", ".exe",
              ".dll", ".so", ".bin", ".lock", ".map",
          }

          def git(*args):
              return subprocess.run(["git", *args], check=True, text=True,
                                    capture_output=True).stdout

          def mask(hit):
              return (hit[:2] + "***" + hit[-2:]) if len(hit) > 4 else "***"

          base = os.environ.get("PR_BASE_SHA") if os.environ.get("EVENT_NAME") == "pull_request" else os.environ.get("BEFORE_SHA")
          head = os.environ.get("HEAD_SHA") or "HEAD"
          # [Stage 17 · 修复] 新建分支 / force-push 时 `github.event.before` 是全 0
          # （全新 ref）或旧提交已不可达。原实现在这种情况下退回 `head^` ——
          # **只扫最后一个 commit**，前面几个提交夹带的 PII 全被漏掉
          # （另一智能体那次 6 个提交、其中 4 个含机型名，就是这么漏过去的）。
          # 现在：零 before 或 before 不可达 → 扫**最近 50 个提交**（有界），
          # 并把实际扫描范围打印出来，一眼能核对。
          #
          # ⚠ 还有一种情况必须处理：**历史重写（filter-repo + force push）之后**
          # `before` 是个合法的 40 位 sha，但它在重写后的仓库里**已经不存在**
          # → `git diff <before> <head>` 直接 exit 128 抛 CalledProcessError
          # （2026-11-07 实测：v1.2.5 那次强推就是这么把 job 弄红的）。
          # 所以先 `rev-parse --verify` 确认它真的可达，不可达就走同一套降级。
          def commit_exists(sha):
              try:
                  git("rev-parse", "--verify", sha + "^{commit}")
                  return True
              except subprocess.CalledProcessError:
                  return False

          zero_before = (not base) or set(base) == {"0"}
          unreachable_before = (not zero_before) and (not commit_exists(base))
          if zero_before or unreachable_before:
              try:
                  log50 = git("rev-list", "--max-count=50", head).split()
                  if len(log50) >= 2:
                      # base 取第 50 个提交自身 → diff 覆盖它之后的 49 个提交
                      base = log50[-1]
                      why = "无可用 before（新分支/强推）" if zero_before else "before 在重写后的历史里不可达（历史重写 / 强推）"
                      print(f"{why} → 扫描最近 {len(log50)} 个提交（base={base[:7]}）")
                  else:
                      print("仓库只有一个提交，没有可扫描的父提交。")
                      sys.exit(0)
              except subprocess.CalledProcessError:
                  print("无法取提交列表；跳过本次扫描（请检查 checkout 是否 fetch-depth: 0）。")
                  sys.exit(0)

          findings = []

          diff = git("diff", "--unified=0", "--no-color", base, head, "--", ".")
          current = None
          newline = 0
          for line in diff.splitlines():
              if line.startswith("+++ b/"):
                  current = line[6:]
                  continue
              if line.startswith("@@"):
                  m = re.match(r"@@ -\d+(?:,\d+)? \+(\d+)", line)
                  newline = int(m.group(1)) if m else 0
                  continue
              if not line.startswith("+") or line.startswith("+++"):
                  continue
              if current and os.path.splitext(current)[1].lower() in SKIP_EXT:
                  newline += 1
                  continue
              text = line[1:]
              for name, rx in patterns:
                  m = rx.search(text)
                  if m:
                      findings.append((current, newline, name, mask(m.group(0))))
              newline += 1

          for msg in git("log", "--format=%B", f"{base}..{head}").splitlines():
              for name, rx in patterns:
                  m = rx.search(msg)
                  if m:
                      findings.append(("<commit message>", 0, name, mask(m.group(0))))

          if findings:
              print("Potential PII detected in new commits:")
              for path, ln, name, masked in findings:
                  print(f"::error file={path},line={ln}::PII ({name}) matched: {masked}")
              sys.exit(1)
          print("PII guard: clean.")
          PY
