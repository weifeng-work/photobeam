name: build

# 产物构建放到 CI 上做（不在开发者本机编译）：
#   · PC 端：dist\PhotoBeam.exe（Windows GUI 子系统，嵌图标 + 应用清单）
#   · 安卓端：PhotoBeam.apk（aapt2 → kotlinc → d8 → zipalign → apksigner，已签名）
# 两个 job 各自产出 artifact，跑完可在 Actions 页面直接下载。
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']      # 打 v* tag → 自动建 Release
  workflow_dispatch:

permissions:
  contents: write   # release job 需要创建 Release / 上传产物

# CI runner 的 Python stdout 默认 cp1252 → 交付校验里打印中文（① 等）会 UnicodeEncodeError
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  pc:
    name: PC 端 (Windows exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      # rsrc：纯 Go 的资源编译器，把 icon.ico + app.manifest 嵌进 exe
      # （不需要 Windows SDK / MinGW 的 rc.exe）
      - name: 安装 rsrc（嵌图标与清单）
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@latest
          $rsrc = Join-Path (go env GOPATH) 'bin\rsrc.exe'
          if (-not (Test-Path $rsrc)) { throw "rsrc 未就位：$rsrc" }
          Write-Output "rsrc 就位：$rsrc"

      # 单元测试（守门人）——放在构建**之前**：测试红了就别浪费时间构建产物。
      # 覆盖：目录保留/路径穿越(pc/relpath_test.go)、幂等键与设备目录(pc/devdir_*.go)、
      # 版本比对与**更新限流降级**(pc/update*_test.go)、剪贴板关键路径性能(pc/clipboard_perf_test.go)。
      - name: 单元测试
        shell: pwsh
        run: |
          # 注意：Go module 在 pc/ 子目录（仓库根没有 go.mod）→ 必须用 -C pc
          go test -C pc -count=1 -timeout 10m ./...

      - name: 构建 PhotoBeam.exe
        shell: pwsh
        run: |
          # build-pc.bat 内部调 bash build-pc.sh → 确保 Git Bash 在 PATH 上
          $env:Path = "C:\Program Files\Git\bin;" + $env:Path
          cmd /c build-pc.bat

      - name: 校验产物
        shell: pwsh
        run: |
          $f = 'dist\PhotoBeam.exe'
          if (-not (Test-Path $f)) { throw '产物不存在' }
          $txt = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($f))
          foreach ($k in @('Microsoft.Windows.Common-Controls','PerMonitorV2','asInvoker')) {
            if (-not $txt.Contains($k)) { throw "清单缺少 $k" }
          }
          Write-Output "产物 $((Get-Item $f).Length) 字节；清单校验通过"

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoBeam-pc-windows
          path: dist/PhotoBeam.exe
          if-no-files-found: error

  android:
    name: 安卓端 (APK)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK：runner 自带 SDK，补装本项目需要的 build-tools / platform
      - name: 安装 Android SDK 组件
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = "$env:LOCALAPPDATA\Android\Sdk" }
          $env:ANDROID_SDK_ROOT = $sdk
          $env:ANDROID_HOME = $sdk
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.android" | Out-Null
          "sdk.dir=$sdk" | Out-File -FilePath "$env:USERPROFILE\.android\repositories.cfg" -Encoding ascii
          $sdkmanager = Get-ChildItem -Path $sdk -Recurse -Filter 'sdkmanager.bat' -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkmanager) { throw "找不到 sdkmanager（sdk=$sdk）" }
          Write-Output "sdkmanager = $sdkmanager"
          # 接受 SDK 许可（非交互）：sdkmanager 需要 y 确认
          $yes = (1..60 | ForEach-Object { 'y' }) -join "`n"
          $yes | & $sdkmanager --sdk_root="$sdk" --licenses | Select-Object -Last 5
          & $sdkmanager --sdk_root="$sdk" 'build-tools;37.0.0' 'platforms;android-36' | Select-Object -Last 15
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager 安装失败（exit=$LASTEXITCODE）" }
          foreach ($p in @("$sdk\build-tools\37.0.0\aapt2.exe", "$sdk\platforms\android-36\android.jar")) {
            if (-not (Test-Path $p)) { throw "缺少 $p" }
          }
          Write-Output "SDK 组件安装完成（sdk=$sdk）"

      # kotlinc（不进仓库，体积大）：从 JetBrains 官方 release 取 2.1.20（与本机一致）
      - name: 准备 kotlinc + BouncyCastle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          curl.exe -L --fail -o tools\kotlinc.zip `
            https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip
          Expand-Archive tools\kotlinc.zip -DestinationPath tools\ktmp -Force
          Move-Item tools\ktmp\kotlinc tools\kotlinc -Force
          Remove-Item tools\ktmp -Recurse -Force
          curl.exe -L --fail -o tools\bcprov.jar `
            https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar
          if (-not (Test-Path 'tools\kotlinc\bin\kotlinc.bat')) { throw 'kotlinc 未就位' }
          if (-not (Test-Path 'tools\bcprov.jar')) { throw 'bcprov.jar 未就位' }
          Write-Output "kotlinc + bcprov 就绪"

      # 签名材料：release keystore 不进仓库（仓库要脱敏），走 Actions secret
      # 与本机同一把钥匙 → CI 产出的 APK 可以直接覆盖安装本机已装的版本
      - name: 还原签名材料
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
        run: |
          if (-not $env:KEYSTORE_B64) { throw '缺少 secret：APK_KEYSTORE_B64' }
          $b64 = ($env:KEYSTORE_B64 -replace '\s', '')
          if ($b64.Length -lt 100) { throw 'APK_KEYSTORE_B64 长度异常' }
          $dir = "$env:LOCALAPPDATA\PhotoBeam"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [IO.File]::WriteAllBytes("$dir\photobeam-release.keystore", [Convert]::FromBase64String($b64))
          [IO.File]::WriteAllText("$dir\keystore.pass", $env:KEYSTORE_PASS.Trim())
          Write-Output "签名材料已就位（$((Get-Item "$dir\photobeam-release.keystore").Length) 字节）"

      - name: 构建 PhotoBeam.apk
        shell: pwsh
        run: |
          $env:Path = "C:\Program Files\Git\bin;" + $env:Path
          cmd /c build-android.bat

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoBeam-android-apk
          path: PhotoBeam.apk
          if-no-files-found: error

  # ---------- 产物清理 ----------
  # 每次推送产生 2 个 artifact，不清理会无限堆积（默认保留 90 天也会占空间）。
  #
  # 策略：**只删「早于最近一次成功 run」的 artifact**，保留最近两次 run 的产物。
  #   · 不用「本次 run 之外」——upload-artifact 与清理 job 存在并发竞态，
  #     实测会把本次刚上传的产物一起删掉（kept 2 但事后查不到）。
  #   · 改成按 run 时间排序保留最新 2 个 run，最稳且不依赖 run id 比较。
  cleanup-artifacts:
    name: 清理旧产物
    runs-on: ubuntu-latest
    needs: [pc, android]
    permissions:
      actions: write
      contents: read
    if: always()          # 无论前面成败都清理
    steps:
      # 给 artifact 上传留出收尾时间（upload-artifact 的 finalize 有延迟）
      - name: 等待产物上传完成
        run: sleep 30

      - name: 只保留最近 2 个 run 的 artifact
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const KEEP_RUNS = 2;   // 保留最近 2 个 run 的产物
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100
            });
            // 按 workflow_run.id 分组（id 单调递增，大的更新）
            const byRun = new Map();
            for (const a of artifacts) {
              const rid = a.workflow_run ? a.workflow_run.id : 0;
              if (!byRun.has(rid)) byRun.set(rid, []);
              byRun.get(rid).push(a);
            }
            const runIds = [...byRun.keys()].sort((x, y) => y - x);
            const keep = new Set(runIds.slice(0, KEEP_RUNS));
            let n = 0;
            for (const [rid, list] of byRun.entries()) {
              if (keep.has(rid)) continue;
              for (const a of list) {
                try {
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
                  n++;
                } catch (e) {
                  core.warning(`delete artifact ${a.id} failed: ${e.message}`);
                }
              }
            }
            core.info(`deleted ${n} old artifacts, kept runs: ${[...keep].join(', ')}`);

  # ---------- 自动 Release ----------
  # 打 v* tag 触发：重新构建两个产物 → 汇总成 Release（附 apk/exe 下载链接）。
  # 与日常 CI 分开：日常推送只出 artifact，不建 Release。
  release:
    name: 自动发布 Release
    runs-on: windows-latest
    needs: [pc, android]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: 安装 rsrc（嵌图标与清单）
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@latest
          $rsrc = Join-Path (go env GOPATH) 'bin\rsrc.exe'
          if (-not (Test-Path $rsrc)) { throw "rsrc 未就位：$rsrc" }

      - name: 构建 PhotoBeam.exe
        shell: pwsh
        run: |
          $env:Path = "C:\Program Files\Git\bin;" + $env:Path
          cmd /c build-pc.bat

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK 组件
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = "$env:LOCALAPPDATA\Android\Sdk" }
          $env:ANDROID_SDK_ROOT = $sdk
          $env:ANDROID_HOME = $sdk
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.android" | Out-Null
          "sdk.dir=$sdk" | Out-File -FilePath "$env:USERPROFILE\.android\repositories.cfg" -Encoding ascii
          $sdkmanager = Get-ChildItem -Path $sdk -Recurse -Filter 'sdkmanager.bat' -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkmanager) { throw "找不到 sdkmanager（sdk=$sdk）" }
          $yes = (1..60 | ForEach-Object { 'y' }) -join "`n"
          $yes | & $sdkmanager --sdk_root="$sdk" --licenses | Select-Object -Last 3
          & $sdkmanager --sdk_root="$sdk" 'build-tools;37.0.0' 'platforms;android-36' | Select-Object -Last 8
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager 安装失败（exit=$LASTEXITCODE）" }

      - name: 准备 kotlinc + BouncyCastle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          curl.exe -L --fail -o tools\kotlinc.zip `
            https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip
          Expand-Archive tools\kotlinc.zip -DestinationPath tools\ktmp -Force
          Move-Item tools\ktmp\kotlinc tools\kotlinc -Force
          Remove-Item tools\ktmp -Recurse -Force
          curl.exe -L --fail -o tools\bcprov.jar `
            https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar

      - name: 还原签名材料
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
        run: |
          if (-not $env:KEYSTORE_B64) { throw '缺少 secret：APK_KEYSTORE_B64' }
          $b64 = ($env:KEYSTORE_B64 -replace '\s', '')
          $dir = "$env:LOCALAPPDATA\PhotoBeam"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [IO.File]::WriteAllBytes("$dir\photobeam-release.keystore", [Convert]::FromBase64String($b64))
          [IO.File]::WriteAllText("$dir\keystore.pass", $env:KEYSTORE_PASS.Trim())

      - name: 构建 PhotoBeam.apk
        shell: pwsh
        run: |
          $env:Path = "C:\Program Files\Git\bin;" + $env:Path
          cmd /c build-android.bat

      - name: 校验产物
        shell: pwsh
        run: |
          foreach ($f in @('dist\PhotoBeam.exe', 'PhotoBeam.apk')) {
            if (-not (Test-Path $f)) { throw "产物不存在：$f" }
            Write-Output "$f = $((Get-Item $f).Length) 字节"
          }

      - name: 创建 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # 本版改了什么 → 取 tag message（发布时用 git tag -a vX.Y.Z -m "..." 写）
          #
          # 走 **GitHub API** 而不是本地 `git tag -l --format='%(contents)'`：
          # actions/checkout 默认 fetch-depth=1，浅克隆下本地 tag 对象并不可靠
          # （实测 v1.2.1 那次就取到了 commit 的 message 而不是 tag 的）。
          # API 读的是远端的 tag 对象，与克隆深度无关。
          $tagNotes = ""
          try {
            $ref = gh api "repos/$env:REPO/git/ref/tags/$env:TAG" | ConvertFrom-Json
            if ($ref.object.type -eq 'tag') {
              $obj = gh api "repos/$env:REPO/git/tags/$($ref.object.sha)" | ConvertFrom-Json
              $tagNotes = [string]$obj.message
            }
          } catch {
            Write-Output "取 tag message 失败（不影响发布）: $($_.Exception.Message)"
          }
          Write-Output ("tagNotes length = " + $tagNotes.Length)
          $notes = @"
          ## PhotoBeam $env:TAG

          手机截图 / 图片 → 局域网 → Windows 剪贴板。**数据不出局域网，不经过任何云。**

          | 产物 | 说明 |
          |------|------|
          | `PhotoBeam.apk` | Android 13+ 手机端（release 签名，可覆盖升级） |
          | `PhotoBeam.exe` | Windows 10+ x64 接收端（单文件免安装；首次运行需 UAC 允许防火墙） |

          **安装顺序**：先装 PC 端并启动（托盘出现 P 图标），再装手机端按 App 内指引配对。

          使用手册：https://github.com/$env:REPO/blob/$env:TAG/docs/user-journey.md
          "@
          if ($tagNotes.Trim()) {
            $notes = $notes + "`n`n## 本版改动`n`n" + $tagNotes.Trim() + "`n"
          }
          # 已有同名 Release（同 tag 重跑）→ 先删再建
          gh release delete $env:TAG --yes --cleanup-tag 2>&1 | Out-Null
          gh release create $env:TAG --title "PhotoBeam $env:TAG" --notes $notes PhotoBeam.apk "dist\PhotoBeam.exe#PhotoBeam.exe"
          Write-Output "Release $env:TAG 已创建"